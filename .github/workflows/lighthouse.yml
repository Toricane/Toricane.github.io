# Audits the live GitHub Pages site after deployment finishes.
# Requires the repo's "pages build and deployment" workflow (name: pages-build-deployment).
name: Lighthouse

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  LIVE_SITE_URL: https://prajwal.is-a.dev

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Only audit when Pages deployment succeeded (skip failed/cancelled deploys).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    concurrency:
      group: lighthouse-${{ matrix.device }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Wait for live site to serve latest deploy
        run: |
          set -euo pipefail
          url="${{ env.LIVE_SITE_URL }}/"
          echo "Polling $url (up to ~5 min for CDN/Pages propagation)..."
          for attempt in $(seq 1 30); do
            if curl -fsSL -o /dev/null "$url"; then
              echo "Live site responded (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for $url"
          exit 1

      - name: Lighthouse CI (${{ matrix.device }})
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.LIVE_SITE_URL }}/
          configPath: ./lighthouserc.${{ matrix.device }}.json
          uploadArtifacts: true
          temporaryPublicStorage: true
